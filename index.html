<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F3D33">
<title>صندوق السلف</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#F5F1E8; --card:#FFFFFF; --ink:#0F3D33; --ink2:#1B5A4B; --text:#16231F; --muted:#6F7B76;
  --line:#E6E0D2; --accent:#E3A02F; --accent-bg:#FCF1DA;
  --ok:#1F9D6B; --ok-bg:#DDF3EA; --bad:#D4473F; --bad-bg:#FBE6E4; --soft:#EEF3F0;
  --r:20px; --nav:68px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
input,select{font-size:16px;width:100%;min-height:52px;padding:0 16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--ink2)}
.hidden{display:none!important}

/* شريط علوي */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg)}
.topbar h1{flex:1;font-size:20px;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none}
.live{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--muted);flex:none}
.live i{width:9px;height:9px;border-radius:50%;background:var(--bad);display:block}
.live.on i{background:var(--ok);box-shadow:0 0 0 4px var(--ok-bg)}
.live.on{color:var(--ok)}

.screen{display:none;padding:4px 16px 32px}
.screen.active{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.has-nav{padding-bottom:calc(var(--nav) + 40px + env(safe-area-inset-bottom))}

/* الرئيسية */
.welcome{background:var(--ink);color:#F5F1E8;border-radius:28px;padding:24px 22px;margin-bottom:18px;position:relative;overflow:hidden}
.welcome:after{content:"";position:absolute;left:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(227,160,47,.18)}
.welcome h2{font-size:24px;font-weight:900;margin-bottom:4px;position:relative}
.welcome p{opacity:.8;font-size:14px;position:relative}
.big-btn{width:100%;min-height:58px;border-radius:18px;background:var(--accent);color:#2B1D00;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:22px;box-shadow:0 8px 20px rgba(227,160,47,.3)}
.sec-title{font-size:13px;font-weight:800;color:var(--muted);margin:0 4px 10px}
.solfa-item{width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.solfa-item:active{transform:scale(.99)}
.solfa-ico{width:50px;height:50px;border-radius:16px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none}
.solfa-item b{display:block;font-size:17px;font-weight:800;color:var(--ink)}
.solfa-item small{color:var(--muted);font-size:12.5px;font-weight:500}
.chev{margin-inline-start:auto;color:var(--muted);font-size:22px}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-weight:700}

/* نموذج الإنشاء */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:13px;font-weight:800;color:var(--muted);margin-bottom:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{background:var(--accent-bg);border-radius:16px;padding:14px 16px;margin-bottom:18px}
.preview div{display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding:3px 0}
.preview b{color:var(--ink);font-weight:900}
.btn{width:100%;min-height:54px;border-radius:16px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.accent{background:var(--accent);color:#2B1D00}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.line{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.wa{background:#25D366}
.btn:disabled{opacity:.5}

/* لوحة السلفة */
.hero{background:linear-gradient(160deg,var(--ink) 0%,var(--ink2) 100%);color:#F5F1E8;border-radius:28px;padding:22px;margin-bottom:16px}
.hero .lbl{font-size:12.5px;opacity:.75;font-weight:700}
.hero .big{font-size:30px;font-weight:900;margin:2px 0 12px;letter-spacing:.3px}
.hero .big small{font-size:14px;font-weight:700;opacity:.8;margin-inline-start:4px}
.bar{height:12px;background:rgba(255,255,255,.18);border-radius:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:10px;transition:width .5s}
.hero .meta{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:8px;opacity:.85}
.chips3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.chips3 div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 6px;text-align:center}
.chips3 b{display:block;font-size:20px;font-weight:900}
.chips3 span{font-size:11.5px;opacity:.8;font-weight:700}
.chips3 .warn b{color:#FFC76B}

.tab{display:none}.tab.active{display:block;animation:in .2s ease}

.toolbar{display:flex;gap:10px;margin-bottom:12px}
.toolbar input{flex:1}
.add-btn{width:52px;height:52px;border-radius:14px;background:var(--accent);color:#2B1D00;font-size:28px;font-weight:700;flex:none;display:grid;place-items:center}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;min-height:40px;padding:0 16px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-weight:800;font-size:13.5px;color:var(--muted)}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.mcard{width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.mcard:active{transform:scale(.99)}
.mcard.late{border-color:#F0C98B;background:#FFFBF2}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--soft);color:var(--ink);font-weight:900;font-size:18px;display:grid;place-items:center;flex:none}
.mcard.won .avatar{background:var(--accent);color:#2B1D00}
.minfo{flex:1;min-width:0}
.minfo b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{height:6px;background:var(--soft);border-radius:6px;overflow:hidden;margin:6px 0 5px}
.mbar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.mfoot{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.tag{padding:2px 8px;border-radius:8px;font-weight:800;font-size:11.5px}
.tag.won{background:var(--accent-bg);color:#8A5A00}
.tag.late{background:var(--bad-bg);color:var(--bad)}

.late-banner{background:var(--accent-bg);border-radius:var(--r);padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.late-banner b{color:var(--bad);font-size:20px;font-weight:900}
.ok-box{text-align:center;background:var(--ok-bg);color:var(--ok);font-weight:800;padding:26px;border-radius:var(--r)}

/* القرعة */
.draw{background:linear-gradient(160deg,#3B2F8F,#5648C9);color:#fff;border-radius:28px;padding:24px 20px;text-align:center}
.draw h2{font-size:20px;font-weight:900;margin-bottom:4px}
.draw p{opacity:.8;font-size:13.5px;margin-bottom:16px}
#winnerDisplay{min-height:86px;display:grid;place-items:center;font-size:24px;font-weight:900;background:rgba(255,255,255,.14);border-radius:18px;padding:14px;margin-bottom:14px;border:1px solid rgba(255,255,255,.2)}
.chk{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:14px;margin-bottom:14px;min-height:40px}
.chk input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.draw .btn{background:#fff;color:#3B2F8F}
#confirmBox{margin-top:14px;background:rgba(255,255,255,.12);border-radius:18px;padding:14px;text-align:right}
#confirmBox label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
#confirmBox select{margin-bottom:10px;color:var(--text)}
#confirmBox .btn{background:var(--ok);color:#fff}

.stack{display:grid;gap:12px}
.info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.info-card .r{display:flex;justify-content:space-between;padding:7px 0;font-weight:700;font-size:14px;border-bottom:1px dashed var(--line)}
.info-card .r:last-child{border:none}
.info-card .r span:first-child{color:var(--muted)}

/* شريط التنقل السفلي */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);position:relative}
.nav button span.i{font-size:22px;line-height:1}
.nav button.on{color:var(--ink)}
.nav button.on:before{content:"";position:absolute;top:0;width:34px;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
.nav .badge{position:absolute;top:8px;right:calc(50% - 24px);background:var(--bad);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* ورقات سفلية */
.back{position:fixed;inset:0;background:rgba(10,25,20,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.back.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:50%;width:100%;max-width:520px;max-height:88dvh;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;z-index:41;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.open{transform:translate(-50%,0)}
.dlg-back{z-index:50}.dlg{z-index:51}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{font-size:19px;font-weight:900;color:var(--ink);margin-bottom:4px}
.sheet .sub{color:var(--muted);font-weight:700;font-size:13.5px;margin-bottom:14px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat3 div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat3 b{display:block;font-size:15px;font-weight:900;color:var(--ink)}
.stat3 span{font-size:11px;color:var(--muted);font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mcell{min-height:64px;border-radius:14px;background:var(--bad-bg);color:var(--bad);border:1.5px solid #F4C9C5;font-weight:800;font-size:13px;line-height:1.35;padding:6px 4px}
.mcell small{display:block;font-size:11px;font-weight:700;opacity:.85}
.mcell.paid{background:var(--ok-bg);color:var(--ok);border-color:#B5E3D0}
.mcell.future{background:#fff;color:var(--muted);border-color:var(--line)}
.sheet .btn{margin-bottom:10px}

.toast{position:fixed;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,20px);background:var(--text);color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:all .25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

#printArea{display:none}
@media print{
  body{background:#fff;max-width:none}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;direction:rtl;color:#000;padding:10px}
  #printArea h1{font-size:20px;margin-bottom:4px}
  #printArea .meta{font-size:12px;margin-bottom:12px;color:#333}
  #printArea table{width:100%;border-collapse:collapse;font-size:12px}
  #printArea th,#printArea td{border:1px solid #999;padding:6px 8px;text-align:right}
  #printArea th{background:#eee}
  #printArea tr.late td{background:#fff1e0}
}
</style>
</head>
<body>

<!-- ============ الرئيسية ============ -->
<div id="homeScreen" class="screen active">
  <div class="topbar" style="padding-inline:0"><h1>صندوق السلف</h1><div class="live" id="live"><i></i><span id="liveText">اتصال...</span></div></div>
  <div class="welcome"><h2>أهلاً بيك 👋</h2><p>إدارة السلف والأقساط بشكل لحظي، من أي جهاز.</p></div>
  <button class="big-btn" onclick="showCreate()">＋ إنشاء سلفة جديدة</button>
  <div class="sec-title">السلف المسجلة</div>
  <div id="solfasList"></div>
</div>

<!-- ============ إنشاء ============ -->
<div id="createScreen" class="screen">
  <div class="topbar" style="padding-inline:0"><button class="icon-btn" onclick="goHome()" aria-label="رجوع">➜</button><h1>سلفة جديدة</h1></div>
  <div class="form-card">
    <div class="fg"><label>اسم السلفة</label><input type="text" id="newName" placeholder="مثال: سلفة الأصدقاء"></div>
    <div class="row2">
      <div class="fg"><label>المبلغ الإجمالي (د.ع)</label><input type="text" inputmode="numeric" id="newTotal" value="3,000,000" oninput="fmtInput(this)"></div>
      <div class="fg"><label>عدد الأشهر</label><input type="number" inputmode="numeric" id="newMonths" value="12" min="1" max="60" oninput="updatePreview()"></div>
    </div>
    <div class="fg"><label>تاريخ البدء</label><input type="date" id="newStart" onchange="updatePreview()"></div>
    <div class="preview">
      <div><span>قسط الفرد شهرياً</span><b id="pvInst">-</b></div>
      <div><span>تاريخ الانتهاء</span><b id="pvEnd">-</b></div>
    </div>
    <button class="btn ok" onclick="createSolfa()">حفظ وبدء السلفة</button>
  </div>
</div>

<!-- ============ لوحة السلفة ============ -->
<div id="dashScreen" class="screen has-nav">
  <div class="topbar" style="padding-inline:0"><button class="icon-btn" onclick="goHome()" aria-label="رجوع">➜</button><h1 id="dTitle">-</h1></div>

  <div class="hero">
    <div class="lbl">المسدد فعلياً</div>
    <div class="big"><span id="hCollected">0</span><small>د.ع</small></div>
    <div class="bar"><i id="hBar" style="width:0%"></i></div>
    <div class="meta"><span id="hPct">0%</span><span id="hElapsed">-</span></div>
    <div class="chips3">
      <div><b id="hMembers">0</b><span>مشترك</span></div>
      <div><b id="hWon">0</b><span>استلموا</span></div>
      <div class="warn"><b id="hLate">0</b><span>متأخر</span></div>
    </div>
  </div>

  <!-- تبويب الأعضاء -->
  <div id="tab-members" class="tab active">
    <div class="toolbar">
      <input type="search" id="searchBox" placeholder="ابحث عن مشترك..." oninput="renderMembers()">
      <button class="add-btn" onclick="openAddMember()" aria-label="إضافة مشترك">＋</button>
    </div>
    <div class="filters" id="filters">
      <button class="fchip on" data-f="all" onclick="setFilter('all')">الكل</button>
      <button class="fchip" data-f="late" onclick="setFilter('late')">المتأخرون</button>
      <button class="fchip" data-f="notwon" onclick="setFilter('notwon')">لم يستلموا</button>
      <button class="fchip" data-f="won" onclick="setFilter('won')">استلموا</button>
    </div>
    <div id="membersList"></div>
  </div>

  <!-- تبويب المتأخرين -->
  <div id="tab-late" class="tab"><div id="lateWrap"></div></div>

  <!-- تبويب القرعة -->
  <div id="tab-draw" class="tab">
    <div class="draw">
      <h2>🎲 قرعة السلفة</h2>
      <p>تختار فائزاً لم يستلم من قبل، وبشكل عادل</p>
      <div id="winnerDisplay">اضغط للبدء 🏆</div>
      <label class="chk"><input type="checkbox" id="excludeLate"> استبعاد المتأخرين من القرعة</label>
      <button class="btn" id="drawBtn" onclick="startDraw()">ابدأ السحب</button>
      <div id="confirmBox" class="hidden">
        <label>شهر الاستلام</label>
        <select id="winMonth"></select>
        <button class="btn" onclick="confirmWinner()">✓ تثبيت الفائز وحفظه</button>
      </div>
    </div>
  </div>

  <!-- تبويب المزيد -->
  <div id="tab-more" class="tab">
    <div class="info-card" id="infoCard"></div>
    <div class="stack">
      <button class="btn wa" onclick="shareWhatsApp()">إرسال الملخص عبر واتساب</button>
      <button class="btn line" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
      <button class="btn line" onclick="exportCSV()">📊 تصدير إلى Excel</button>
      <button class="btn bad" style="margin-top:10px" onclick="deleteSolfa()">🗑️ حذف هذه السلفة</button>
    </div>
  </div>
</div>

<nav class="nav hidden" id="nav">
  <button class="on" data-t="members" onclick="setTab('members')"><span class="i">👥</span>الأعضاء</button>
  <button data-t="late" onclick="setTab('late')"><span class="i">⚠️</span>المتأخرون<span class="badge hidden" id="lateBadge">0</span></button>
  <button data-t="draw" onclick="setTab('draw')"><span class="i">🎲</span>القرعة</button>
  <button data-t="more" onclick="setTab('more')"><span class="i">☰</span>المزيد</button>
</nav>

<div id="printArea"></div>

<div class="back" id="sheetBack" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="back dlg-back" id="dlgBack"></div>
<div class="sheet dlg" id="dlg"></div>
<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({ databaseURL: "https://solfaapp-1dda3-default-rtdb.firebaseio.com/" });
const db = firebase.database();

/* ---------- الاتصال ---------- */
db.ref(".info/connected").on("value", s => {
  const on = s.val() === true, el = document.getElementById('live');
  el.classList.toggle('on', on);
  document.getElementById('liveText').textContent = on ? 'متصل' : 'غير متصل';
});

/* ---------- أدوات ---------- */
const MONTH_NAMES = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const rawNum = v => v ? Number(String(v).replace(/,/g, '')) : 0;
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthName(s,i){ const sm=Number(s.meta.startDate.split('-')[1])-1; return MONTH_NAMES[(sm+i-1)%12]; }
function elapsedMonths(s){
  const [sy,sm]=s.meta.startDate.split('-').map(Number), n=new Date();
  const e=(n.getFullYear()-sy)*12+(n.getMonth()+1-sm)+1;
  return Math.max(0,Math.min(e,s.meta.monthsCount||12));
}
let toastT;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }

/* ---------- الحالة ---------- */
let cache = {}, curId = null, listener = null, filter = 'all', tab = 'members';
let openMemberId = null, pendingWinner = null, drawTimer = null;

/* ---------- الورقات السفلية ---------- */
function openSheet(html){ const s=document.getElementById('sheet'); s.innerHTML='<div class="grab"></div>'+html; s.classList.add('open'); document.getElementById('sheetBack').classList.add('open'); }
function closeSheet(){ openMemberId=null; document.getElementById('sheet').classList.remove('open'); document.getElementById('sheetBack').classList.remove('open'); }

// نافذة تأكيد/إدخال تُرجع Promise
function ask({title, msg='', input=null, ok='تأكيد', danger=false}){
  return new Promise(res=>{
    const d=document.getElementById('dlg'), b=document.getElementById('dlgBack');
    d.innerHTML=`<div class="grab"></div><h3>${esc(title)}</h3><div class="sub">${esc(msg)}</div>
      ${input!==null?`<input id="dlgInput" type="text" value="${esc(input)}" style="margin-bottom:12px">`:''}
      <button class="btn ${danger?'bad':'ok'}" id="dlgOk">${esc(ok)}</button>
      <button class="btn line" id="dlgNo">إلغاء</button>`;
    const done=v=>{ d.classList.remove('open'); b.classList.remove('open'); res(v); };
    document.getElementById('dlgOk').onclick=()=>done(input!==null?document.getElementById('dlgInput').value:true);
    document.getElementById('dlgNo').onclick=()=>done(input!==null?null:false);
    b.onclick=()=>done(input!==null?null:false);
    d.classList.add('open'); b.classList.add('open');
  });
}

/* ---------- التنقل ---------- */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('nav').classList.toggle('hidden', id!=='dashScreen');
  window.scrollTo(0,0);
}
function goHome(){
  showScreen('homeScreen'); curId=null; closeSheet();
  if(listener){ listener.off(); listener=null; }
  clearInterval(drawTimer); loadSolfas();
}
function showCreate(){ showScreen('createScreen'); document.getElementById('newStart').value=todayStr(); updatePreview(); }
function setTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.id==='tab-'+t));
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  window.scrollTo({top:0,behavior:'smooth'});
}
function setFilter(f){
  filter=f;
  document.querySelectorAll('#filters .fchip').forEach(b=>b.classList.toggle('on', b.dataset.f===f));
  renderMembers();
}

/* ---------- إنشاء سلفة ---------- */
function fmtInput(i){ const v=i.value.replace(/\D/g,''); i.value=v?Number(v).toLocaleString('en-US'):''; updatePreview(); }
function updatePreview(){
  const total=rawNum(document.getElementById('newTotal').value);
  const m=Number(document.getElementById('newMonths').value)||12;
  const st=document.getElementById('newStart').value||todayStr();
  document.getElementById('pvInst').textContent=fmt(Math.round(total/m))+' د.ع';
  const e=new Date(st); e.setMonth(e.getMonth()+m);
  document.getElementById('pvEnd').textContent=e.toISOString().split('T')[0];
}
function createSolfa(){
  const name=document.getElementById('newName').value.trim();
  const total=rawNum(document.getElementById('newTotal').value);
  const m=Number(document.getElementById('newMonths').value)||12;
  const start=document.getElementById('newStart').value||todayStr();
  if(!name) return toast('اكتب اسم السلفة');
  if(total<=0) return toast('اكتب مبلغ صحيح');
  if(m<1||m>60) return toast('عدد الأشهر بين 1 و 60');
  const e=new Date(start); e.setMonth(e.getMonth()+m);
  const ref=db.ref('solfas').push();
  ref.set({ meta:{name,totalAmount:total,installment:Math.round(total/m),startDate:start,endDate:e.toISOString().split('T')[0],monthsCount:m}, members:{} })
    .then(()=>{ document.getElementById('newName').value=''; openSolfa(ref.key); })
    .catch(err=>toast('تعذر الحفظ: '+err.message));
}

/* ---------- قائمة السلف ---------- */
function loadSolfas(){
  const c=document.getElementById('solfasList');
  c.innerHTML='<div class="empty">جاري التحميل...</div>';
  db.ref('solfas').once('value').then(snap=>{
    const data=snap.val();
    if(!data){ c.innerHTML='<div class="empty">ما كو سلف بعد. ابدأ بإنشاء أول سلفة 👆</div>'; return; }
    cache=Object.assign(cache,data);
    c.innerHTML=Object.keys(data).filter(id=>data[id].meta).map(id=>{
      const s=data[id], n=s.members?Object.keys(s.members).length:0;
      return `<button class="solfa-item" onclick="openSolfa('${id}')">
        <div class="solfa-ico">💰</div>
        <div><b>${esc(s.meta.name)}</b><small>${n} مشترك · ${fmt(s.meta.installment)} د.ع شهرياً</small></div>
        <span class="chev">‹</span></button>`;
    }).join('');
  }).catch(()=>{ c.innerHTML='<div class="empty" style="color:var(--bad)">فشل الاتصال، حاول مرة ثانية</div>'; });
}

function openSolfa(id){
  curId=id; filter='all'; pendingWinner=null; openMemberId=null;
  document.getElementById('confirmBox').classList.add('hidden');
  document.getElementById('winnerDisplay').textContent='اضغط للبدء 🏆';
  document.getElementById('searchBox').value='';
  setFilter('all'); showScreen('dashScreen'); setTab('members');
  if(listener) listener.off();
  listener=db.ref('solfas/'+id);
  listener.on('value',snap=>{ const d=snap.val(); if(d){ cache[id]=d; renderAll(); } });
}

/* ---------- الحسابات ---------- */
function computeStats(s){
  const count=s.meta.monthsCount||12, inst=Number(s.meta.installment)||0, elapsed=elapsedMonths(s);
  const ms=s.members||{};
  const list=Object.keys(ms).map(id=>{
    const m=ms[id]; let paid=0; const late=[];
    for(let i=1;i<=count;i++){ const p=m.months&&m.months['month_'+i]; if(p) paid++; else if(i<=elapsed) late.push(i); }
    return {id,name:m.name||'',hasWon:!!m.hasWon,wonMonth:m.wonMonth||'',paid,paidAmount:paid*inst,remaining:(count-paid)*inst,lateMonths:late,owed:late.length*inst};
  });
  const collected=list.reduce((a,m)=>a+m.paidAmount,0), expected=list.length*count*inst;
  return {list,count,inst,elapsed,collected,expected,remaining:expected-collected};
}

/* ---------- العرض ---------- */
function renderAll(){
  const s=cache[curId]; if(!s||!s.meta) return;
  const st=computeStats(s);
  const late=st.list.filter(m=>m.lateMonths.length);
  document.getElementById('dTitle').textContent=s.meta.name;
  document.getElementById('hCollected').textContent=fmt(st.collected);
  const pct=st.expected>0?Math.round(st.collected/st.expected*100):0;
  document.getElementById('hBar').style.width=pct+'%';
  document.getElementById('hPct').textContent=pct+'% من '+fmt(st.expected);
  document.getElementById('hElapsed').textContent='مضى '+st.elapsed+' من '+st.count+' شهر';
  document.getElementById('hMembers').textContent=st.list.length;
  document.getElementById('hWon').textContent=st.list.filter(m=>m.hasWon).length;
  document.getElementById('hLate').textContent=late.length;
  const b=document.getElementById('lateBadge'); b.textContent=late.length; b.classList.toggle('hidden',late.length===0);

  renderMembers(); renderLate(s,st,late); renderInfo(s,st); renderPrint(s,st);
  if(openMemberId) renderMemberSheet();
}

function renderMembers(){
  const s=cache[curId]; if(!s||!s.meta) return;
  const st=computeStats(s), q=document.getElementById('searchBox').value.trim().toLowerCase();
  const c=document.getElementById('membersList');
  if(!st.list.length){ c.innerHTML='<div class="empty">ما كو مشتركين. اضغط ＋ لإضافة أول مشترك</div>'; return; }
  const rows=st.list.filter(m=>{
    if(q&&!m.name.toLowerCase().includes(q)) return false;
    if(filter==='late') return m.lateMonths.length>0;
    if(filter==='won') return m.hasWon;
    if(filter==='notwon') return !m.hasWon;
    return true;
  });
  if(!rows.length){ c.innerHTML='<div class="empty">لا توجد نتائج</div>'; return; }
  c.innerHTML=rows.map(m=>`
    <button class="mcard ${m.lateMonths.length?'late':''} ${m.hasWon?'won':''}" onclick="openMember('${m.id}')">
      <div class="avatar">${esc((m.name.trim()[0]||'؟'))}</div>
      <div class="minfo">
        <b>${esc(m.name)}</b>
        <div class="mbar"><i style="width:${Math.round(m.paid/st.count*100)}%"></i></div>
        <div class="mfoot"><span>${m.paid}/${st.count} شهر</span>
          ${m.hasWon?`<span class="tag won">⭐ استلم${m.wonMonth?' · ش'+esc(m.wonMonth):''}</span>`:''}
          ${m.lateMonths.length?`<span class="tag late">متأخر ${m.lateMonths.length}</span>`:''}
        </div>
      </div>
      <span class="chev">‹</span>
    </button>`).join('');
}

function renderLate(s,st,late){
  const w=document.getElementById('lateWrap');
  if(!st.list.length){ w.innerHTML='<div class="empty">أضف مشتركين لتظهر المتابعة هنا</div>'; return; }
  if(!late.length){ w.innerHTML='<div class="ok-box">✓ الجميع ملتزم بالتسديد لحد الآن</div>'; return; }
  late.sort((a,b)=>b.owed-a.owed);
  const total=late.reduce((a,m)=>a+m.owed,0);
  w.innerHTML=`<div class="late-banner"><span>إجمالي المتأخرات<br><small style="color:var(--muted)">${late.length} مشترك</small></span><b>${fmt(total)} د.ع</b></div>`+
    late.map(m=>`
    <button class="mcard late" onclick="openMember('${m.id}')">
      <div class="avatar">${esc((m.name.trim()[0]||'؟'))}</div>
      <div class="minfo"><b>${esc(m.name)}</b>
        <div class="mfoot" style="margin-top:4px">${m.lateMonths.map(i=>esc(monthName(s,i))).join(' · ')}</div></div>
      <div style="text-align:left;flex:none"><b style="color:var(--bad);font-weight:900">${fmt(m.owed)}</b><div style="font-size:11px;color:var(--muted);font-weight:700">د.ع</div></div>
    </button>`).join('');
}

function renderInfo(s,st){
  document.getElementById('infoCard').innerHTML=`
    <div class="r"><span>قيمة الصندوق</span><span>${fmt(s.meta.totalAmount)} د.ع</span></div>
    <div class="r"><span>القسط الشهري</span><span>${fmt(st.inst)} د.ع</span></div>
    <div class="r"><span>عدد الأشهر</span><span>${st.count}</span></div>
    <div class="r"><span>البداية</span><span>${esc(s.meta.startDate)}</span></div>
    <div class="r"><span>النهاية</span><span>${esc(s.meta.endDate)}</span></div>
    <div class="r"><span>المتبقي للتسديد</span><span style="color:var(--bad)">${fmt(st.remaining)} د.ع</span></div>`;
}

/* ---------- ورقة المشترك ---------- */
function openMember(id){ openMemberId=id; openSheet(''); renderMemberSheet(); }
function renderMemberSheet(){
  const s=cache[curId]; if(!s) return;
  const st=computeStats(s), m=st.list.find(x=>x.id===openMemberId);
  if(!m){ closeSheet(); return; }
  const raw=s.members[m.id], sh=document.getElementById('sheet'), top=sh.scrollTop;
  let cells='';
  for(let i=1;i<=st.count;i++){
    const p=raw.months&&raw.months['month_'+i];
    const cls=p?'paid':(i>st.elapsed?'future':'');
    cells+=`<button class="mcell ${cls}" onclick="toggleMonth('${m.id}',${i})">ش${i} · ${esc(monthName(s,i))}<small>${p?'✓ مسدد':(i>st.elapsed?'قادم':'✕ غير مسدد')}</small></button>`;
  }
  sh.innerHTML=`<div class="grab"></div>
    <h3>👤 ${esc(m.name)}</h3>
    <div class="sub">${m.hasWon?'⭐ استلم السلفة'+(m.wonMonth?' (الشهر '+esc(m.wonMonth)+')':''):'لم يستلم السلفة بعد'}</div>
    <div class="stat3">
      <div><b>${fmt(m.paidAmount)}</b><span>المسدد</span></div>
      <div><b>${fmt(m.remaining)}</b><span>المتبقي</span></div>
      <div><b style="color:${m.owed?'var(--bad)':'var(--ok)'}">${fmt(m.owed)}</b><span>المتأخر</span></div>
    </div>
    <div class="sec-title">اضغط على الشهر لتبديل حالة التسديد</div>
    <div class="mgrid">${cells}</div>
    ${m.lateMonths.length?`<button class="btn ok" onclick="payAllDue('${m.id}')">تسديد كل المستحق (${fmt(m.owed)} د.ع)</button>`:''}
    <button class="btn accent" onclick="toggleWinner('${m.id}')">${m.hasWon?'إلغاء حالة الاستلام':'⭐ تسجيل استلام السلفة'}</button>
    <button class="btn line" onclick="deleteMember('${m.id}')" style="color:var(--bad)">🗑️ حذف المشترك</button>`;
  sh.scrollTop=top;
}

async function toggleMonth(mId,i){
  const key='month_'+i, cur=cache[curId].members[mId].months&&cache[curId].members[mId].months[key];
  if(cur){ const ok=await ask({title:'إلغاء التسديد؟',msg:'هذا الشهر مسجل كمسدد. هل تريد إلغاءه؟',ok:'نعم، إلغاء',danger:true}); if(!ok) return; }
  db.ref(`solfas/${curId}/members/${mId}/months/${key}`).set(!cur);
}
async function payAllDue(mId){
  const s=cache[curId], st=computeStats(s), m=st.list.find(x=>x.id===mId);
  const ok=await ask({title:'تسديد كل المستحق',msg:`سيتم تسجيل ${m.lateMonths.length} شهر كمسدد بمبلغ ${fmt(m.owed)} د.ع`,ok:'تأكيد التسديد'});
  if(!ok) return;
  const upd={}; m.lateMonths.forEach(i=>upd['month_'+i]=true);
  db.ref(`solfas/${curId}/members/${mId}/months`).update(upd).then(()=>toast('تم التسديد ✓'));
}

function freeMonths(s,exceptId){
  const used=new Set();
  Object.entries(s.members||{}).forEach(([id,m])=>{ if(id!==exceptId&&m.hasWon&&m.wonMonth) used.add(String(m.wonMonth)); });
  const out=[]; for(let i=1;i<=(s.meta.monthsCount||12);i++) if(!used.has(String(i))) out.push(i);
  return out;
}
async function toggleWinner(mId){
  const s=cache[curId], m=s.members[mId];
  if(m.hasWon){
    const ok=await ask({title:'إلغاء الاستلام؟',msg:'سيرجع المشترك إلى قائمة من لم يستلموا.',ok:'نعم، إلغاء',danger:true});
    if(ok) db.ref(`solfas/${curId}/members/${mId}`).update({hasWon:false,wonMonth:''});
    return;
  }
  const free=freeMonths(s,mId);
  if(!free.length) return toast('كل أشهر الاستلام محجوزة');
  const v=await ask({title:'شهر الاستلام',msg:'الأشهر المتاحة: '+free.join('، '),input:String(free[0]),ok:'حفظ'});
  if(v===null) return;
  const n=Number(v);
  if(!free.includes(n)) return toast('هذا الشهر غير متاح');
  db.ref(`solfas/${curId}/members/${mId}`).update({hasWon:true,wonMonth:String(n)}).then(()=>toast('تم تسجيل الاستلام ✓'));
}
async function deleteMember(mId){
  const ok=await ask({title:'حذف المشترك؟',msg:'سيتم حذف المشترك وكل سجل تسديده نهائياً.',ok:'حذف',danger:true});
  if(!ok) return;
  closeSheet(); db.ref(`solfas/${curId}/members/${mId}`).remove().then(()=>toast('تم الحذف'));
}

/* ---------- إضافة مشترك ---------- */
function openAddMember(){
  openSheet(`<h3>إضافة مشترك</h3><div class="sub">اكتب الاسم الثلاثي</div>
    <input id="newMember" type="text" placeholder="اسم المشترك" style="margin-bottom:12px" autocomplete="off">
    <button class="btn ok" onclick="addMember()">حفظ المشترك</button>`);
  setTimeout(()=>{ const i=document.getElementById('newMember'); if(i){ i.focus(); i.onkeydown=e=>{ if(e.key==='Enter') addMember(); }; } },300);
}
async function addMember(){
  const input=document.getElementById('newMember'), name=input.value.trim();
  if(!name) return toast('اكتب اسم المشترك');
  const s=cache[curId], ms=s.members||{}, count=s.meta.monthsCount||12;
  if(Object.values(ms).some(m=>(m.name||'').trim()===name)){
    if(!await ask({title:'اسم مكرر',msg:'يوجد مشترك بنفس الاسم. هل تريد إضافته أيضاً؟',ok:'إضافة'})) return;
  }
  if(Object.keys(ms).length>=count){
    if(!await ask({title:'العدد مكتمل',msg:`عدد المشتركين وصل ${count} (يساوي عدد الأشهر). هل تريد المتابعة؟`,ok:'متابعة'})) return;
  }
  const months={}; for(let i=1;i<=count;i++) months['month_'+i]=false;
  db.ref(`solfas/${curId}/members`).push().set({name,hasWon:false,wonMonth:'',months}).then(()=>{ closeSheet(); toast('تمت الإضافة ✓'); });
}

/* ---------- القرعة ---------- */
function startDraw(){
  const s=cache[curId], st=computeStats(s), ex=document.getElementById('excludeLate').checked;
  const elig=st.list.filter(m=>!m.hasWon&&(!ex||m.lateMonths.length===0));
  if(!elig.length) return toast(ex?'لا يوجد مؤهلون (الباقون متأخرون أو استلموا)':'كل المشتركين استلموا');
  if(!freeMonths(s).length) return toast('كل أشهر الاستلام محجوزة');
  const disp=document.getElementById('winnerDisplay'), btn=document.getElementById('drawBtn');
  document.getElementById('confirmBox').classList.add('hidden'); pendingWinner=null; btn.disabled=true;
  const win=elig[Math.floor(Math.random()*elig.length)]; let n=0;
  clearInterval(drawTimer);
  drawTimer=setInterval(()=>{
    n++;
    if(n>18){
      clearInterval(drawTimer);
      disp.textContent='🎉 '+win.name; pendingWinner=win.id;
      document.getElementById('winMonth').innerHTML=freeMonths(s).map(i=>`<option value="${i}">الشهر ${i} - ${esc(monthName(s,i))}</option>`).join('');
      document.getElementById('confirmBox').classList.remove('hidden'); btn.disabled=false; btn.textContent='إعادة السحب';
    } else disp.textContent=elig[Math.floor(Math.random()*elig.length)].name;
  },80);
}
function confirmWinner(){
  if(!pendingWinner) return;
  const m=document.getElementById('winMonth').value;
  db.ref(`solfas/${curId}/members/${pendingWinner}`).update({hasWon:true,wonMonth:String(m)}).then(()=>{
    pendingWinner=null; document.getElementById('confirmBox').classList.add('hidden');
    document.getElementById('winnerDisplay').textContent='✓ تم تثبيت الفائز';
    document.getElementById('drawBtn').textContent='ابدأ السحب'; toast('تم الحفظ ✓');
  });
}

/* ---------- مشاركة وطباعة وتصدير ---------- */
function renderPrint(s,st){
  const rows=st.list.map((m,i)=>`<tr class="${m.lateMonths.length?'late':''}"><td>${i+1}</td><td>${esc(m.name)}</td><td>${m.paid} / ${st.count}</td><td>${fmt(m.paidAmount)}</td><td>${fmt(m.remaining)}</td><td>${m.lateMonths.length?fmt(m.owed):'-'}</td><td>${m.hasWon?'استلم'+(m.wonMonth?' (شهر '+esc(m.wonMonth)+')':''):'-'}</td></tr>`).join('');
  document.getElementById('printArea').innerHTML=`<h1>كشف سلفة: ${esc(s.meta.name)}</h1>
    <div class="meta">التاريخ: ${todayStr()} | من ${esc(s.meta.startDate)} إلى ${esc(s.meta.endDate)} | القسط الشهري: ${fmt(st.inst)} د.ع | قيمة الصندوق: ${fmt(s.meta.totalAmount)} د.ع<br>المسدد: ${fmt(st.collected)} د.ع | المتبقي: ${fmt(st.remaining)} د.ع</div>
    <table><thead><tr><th>#</th><th>الاسم</th><th>الأشهر المسددة</th><th>المسدد</th><th>المتبقي</th><th>المتأخر</th><th>الاستلام</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function shareWhatsApp(){
  const s=cache[curId], st=computeStats(s);
  const late=st.list.filter(m=>m.lateMonths.length).sort((a,b)=>b.owed-a.owed);
  const pct=st.expected>0?Math.round(st.collected/st.expected*100):0;
  let t=`📊 *ملخص ${s.meta.name}*\n📅 ${todayStr()}\n\n👥 المشتركين: ${st.list.length}\n✅ المستلمين: ${st.list.filter(m=>m.hasWon).length}\n💰 المسدد: ${fmt(st.collected)} د.ع (${pct}%)\n⏳ المتبقي: ${fmt(st.remaining)} د.ع\n🗓 القسط الشهري: ${fmt(st.inst)} د.ع\n`;
  if(late.length){ t+=`\n⚠️ *المتأخرون عن التسديد:*\n`; late.forEach(m=>t+=`• ${m.name}: ${fmt(m.owed)} د.ع (${m.lateMonths.length} شهر)\n`); }
  else t+=`\n✓ الجميع ملتزم بالتسديد`;
  window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
function exportCSV(){
  const s=cache[curId], st=computeStats(s), q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const lines=[['الاسم','الأشهر المسددة','المبلغ المسدد','المتبقي','الأشهر المتأخرة','مبلغ المتأخر','استلم','شهر الاستلام'].map(q).join(',')];
  st.list.forEach(m=>lines.push([m.name,`${m.paid}/${st.count}`,m.paidAmount,m.remaining,m.lateMonths.length,m.owed,m.hasWon?'نعم':'لا',m.wonMonth].map(q).join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8;'}));
  a.download=`${s.meta.name}-${todayStr()}.csv`; document.body.appendChild(a); a.click(); a.remove();
}
async function deleteSolfa(){
  const s=cache[curId];
  const v=await ask({title:'حذف السلفة نهائياً',msg:'للتأكيد اكتب اسم السلفة بالضبط: '+s.meta.name,input:'',ok:'حذف نهائي',danger:true});
  if(v===null) return;
  if(v.trim()!==s.meta.name.trim()) return toast('الاسم غير مطابق، لم يتم الحذف');
  const id=curId; goHome(); db.ref('solfas/'+id).remove().then(()=>{ delete cache[id]; loadSolfas(); toast('تم حذف السلفة'); });
}

loadSolfas();
</script>
